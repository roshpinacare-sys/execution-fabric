# codelint — שער-הבריאות-הרחוק של-הבד (הוכח-ריצה: 2026-10-20, ריצה-ירוקה-ראשונה מתועדת-ב-API)
#
# עקרונות:
#  · נקה-סביבה = האמת: postinstall לא מריץ prisma generate בסביבה-נקייה — בונים-את-ה-client
#    במפורש לפני-build (`@prisma/client did not initialize yet` = הכישלון-המכונן).
#  · Node 20 מוצהר (Next 15 דורש ≥18.18; בלי-הצהרה ה-runner עלול-להיתלות-על-18).
#  · paths-filter: פעימות-הדופק (db/custom.db, chain-export, sovereign/site) אינן-מבזבזות-runner.
#  · concurrency+cancel: דחיפות-רצופות מבטלות-ריצות-מיושנות.
#  · fail-honest: כישלון = העלאת-לוגים-כראיה (לא-שקט, לא-שקר).
name: codelint

on:
  push:
    paths:
      - 'src/**'
      - '.github/**'
      - 'package.json'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'mini-services/**'
  pull_request:
    paths:
      - 'src/**'
      - '.github/**'
      - 'package.json'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'mini-services/**'

concurrency:
  group: codelint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-24.04 # ubuntu-latest מתחיל-לנדוד-ל-26 ב-2026-10-19 — מצהירים-סביבה-קבועה
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (clean-env truth)
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Upload failure logs (fail-honest)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            .next/**/*.log
          if-no-files-found: ignore
          retention-days: 3
